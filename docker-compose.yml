services:
  surrealdb:
    image: surrealdb/surrealdb:v2.2.1
    container_name: hidow-surrealdb
    ports:
      - "8123:8000"
    command: start --log info --user root --pass root memory
    restart: unless-stopped

  surrealist:
    image: surrealdb/surrealist:latest
    container_name: hidow-surrealist
    ports:
      - "8124:8080"
    depends_on:
      - surrealdb
    restart: unless-stopped
